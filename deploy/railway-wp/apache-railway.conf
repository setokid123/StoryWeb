# Railway's edge proxy reaches the container from the shared address range 100.64.0.0/10. The base image's
# mod_remoteip trusts the usual private ranges but not this one, so every visitor showed up as the proxy.
# Trusting it makes REMOTE_ADDR the visitor's own address, which login limits, rate limits and logs rely on.
<IfModule remoteip_module>
	RemoteIPInternalProxy 100.64.0.0/10
</IfModule>
